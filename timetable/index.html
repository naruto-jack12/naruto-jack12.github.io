<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="可视化拖拽课程表制作工具，支持自定义科目、保存课表截图。">
    <title>课程表</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="assets/css/style.css">

    <script src="assets/js/html2canvas.js"></script>
</head>
<body>
    <div id="app">
        <div class="inner">
            <div class="wrapper">
                <h1>课程表</h1>
                <div class="container">
                    <div class="subjects" data-allow="move">
                        <!-- 科目列表由 assets/js/script.js 从 data/subjects.json 渲染 -->
                    </div>
                    <div class="timetable">
                        <table>
                            <!-- 列的分组 -->
                            <colgroup>
                                <col />
                                <col />
                                <col />
                                <col />
                                <col />
                                <col />
                                <col />
                                <col />
                            </colgroup>

                            <thead>
                                <tr>
                                    <th class="corner" scope="col"></th>
                                    <th>星期一</th>
                                    <th>星期二</th>
                                    <th>星期三</th>
                                    <th>星期四</th>
                                    <th>星期五</th>
                                    <th>星期六</th>
                                    <th>星期天</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <th rowspan="4" class="span">上午</th>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                </tr>
                                <tr>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                </tr>
                                <tr>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                </tr>
                                <tr>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                </tr>
                                <tr class="none">
                                    <td colspan="8"></td>
                                </tr>
                                <tr>
                                    <th rowspan="4" class="span">下午</th>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                </tr>
                                <tr>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                </tr>
                                <tr>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                </tr>
                                <tr>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                    <td data-allow="copy"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="screenshotBtn">
                <button type="button" id="btn-shot">保存课表截图</button>
                <button type="button" id="btn-clear">清空课表</button>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
    <script src="assets/js/save.js"></script>

    <div class="mobile-message">
        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg></div>
        <h1>请使用电脑端访问</h1>
        <p>课程表需要拖拽排课，请使用电脑浏览器获得完整体验。</p>
        <small>（屏幕宽度过小，已隐藏课表）</small>
    </div>
</body>
</html>
